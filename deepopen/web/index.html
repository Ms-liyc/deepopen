<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepOpen 代码检查台</title>
  <link rel="icon" href="/static/logo.jpg" type="image/jpeg">
  <style>
    :root {
      --bg: #08111d;
      --panel: #0f1a2a;
      --panel-2: #132033;
      --line: #24344c;
      --text: #e8eef7;
      --muted: #8ea0b8;
      --mint: #3ee0b2;
      --gold: #f3c15a;
      --coral: #ff6b7a;
      --violet: #c084fc;
      --sky: #5ec8ff;
      --ok: #3ee0b2;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "Cascadia Code", "Consolas", monospace;
      --aside: 300px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    body {
      background-image:
        radial-gradient(1200px 500px at 10% -10%, rgba(62, 224, 178, .08), transparent 50%),
        linear-gradient(180deg, rgba(255,255,255,.02), transparent 30%);
      overflow: hidden;
    }
    .app {
      display: grid;
      grid-template-columns: var(--aside) minmax(0, 1fr);
      height: 100%;
    }
    aside {
      border-right: 1px solid var(--line);
      background: rgba(15, 26, 42, .94);
      padding: 18px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
    }
    .brand { display: flex; gap: 12px; align-items: center; padding: 2px 2px 4px; }
    .mark {
      width: 52px; height: 52px; border-radius: 14px;
      object-fit: cover; object-position: center;
      flex-shrink: 0; background: #08111d; border: 1px solid var(--line);
    }
    .brand h1 { font-size: 18px; margin: 0; letter-spacing: .03em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .block {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .block-title {
      font-size: 11px; color: var(--muted); letter-spacing: .08em;
      text-transform: uppercase; margin: 0;
    }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    input[type=text], select {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit;
    }
    input[type=text]:focus, select:focus { outline: 1px solid rgba(62,224,178,.45); border-color: var(--mint); }
    .row { display: flex; gap: 8px; }
    button {
      border: 0; border-radius: 10px; padding: 10px 12px; font: inherit; cursor: pointer;
      background: var(--mint); color: #062019; font-weight: 700;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
    button.plan { background: transparent; color: var(--mint); border: 1px solid var(--mint); font-weight: 700; width: 100%; }
    button:disabled { opacity: .55; cursor: wait; }
    #run { width: 100%; }
    .tabs { display: flex; gap: 6px; }
    .tabs button { flex: 1; font-size: 12px; padding: 8px 6px; }
    .tabs button.active { background: var(--panel-2); color: var(--mint); border: 1px solid var(--mint); }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 0; }
    .opt {
      display: flex; align-items: flex-start; gap: 8px; color: var(--text);
      font-size: 12px; line-height: 1.4; cursor: pointer; margin: 0;
    }
    .opt input { margin-top: 2px; accent-color: var(--mint); }
    #scan-meta { margin-top: auto; padding-top: 6px; }
    main {
      min-width: 0; min-height: 0;
      padding: 18px 22px 18px;
      display: flex; flex-direction: column;
    }
    section { min-height: 0; }
    #view-scan:not([hidden]) {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; gap: 12px;
    }
    #view-rules:not([hidden]), #view-guide:not([hidden]) {
      flex: 1; min-height: 0; overflow: auto;
    }
    .progress-wrap {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; flex-shrink: 0;
    }
    .progress-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 8px; }
    .progress-head b { color: var(--mint); font-variant-numeric: tabular-nums; }
    .progress-track { height: 8px; background: #08111d; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
    .progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--mint), var(--sky));
      transition: width .12s ease;
    }
    .progress-meta { margin-top: 8px; color: var(--muted); font-size: 12px; word-break: break-all; }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; flex-shrink: 0; }
    .stat {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    }
    .stat b { display: block; font-size: 24px; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: 12px; }
    .stat.critical b { color: var(--violet); }
    .stat.high b { color: var(--coral); }
    .stat.medium b { color: var(--gold); }
    .stat.low b { color: var(--sky); }
    .stat.info b { color: var(--muted); }
    .toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex-shrink: 0;
    }
    .toolbar #q { flex: 1; min-width: 180px; max-width: 360px; }
    .toolbar #cat { width: 140px; }
    .chip {
      border: 1px solid var(--line); background: var(--panel); color: var(--muted);
      border-radius: 999px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    .chip.on { color: var(--text); border-color: var(--mint); background: #123142; }
    .layout {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr);
      gap: 14px;
    }
    .list, .detail, .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    }
    .list, .detail { min-height: 0; overflow: auto; }
    .list-head, .detail-head {
      position: sticky; top: 0; z-index: 1;
      background: var(--panel-2); border-bottom: 1px solid var(--line);
      padding: 10px 14px; font-size: 12px; color: var(--muted);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-size: 11px; letter-spacing: .05em; padding: 10px 12px; }
    td { padding: 11px 12px; border-top: 1px solid var(--line); vertical-align: top; cursor: pointer; }
    tr:hover td { background: #15263a; }
    tr.selected td { background: #173047; }
    .rule-id { font-family: var(--mono); font-size: 12px; color: var(--mint); }
    .muted { color: var(--muted); font-size: 12px; }
    .sev { font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .sev.critical { color: var(--violet); }
    .sev.high { color: var(--coral); }
    .sev.medium { color: var(--gold); }
    .sev.low { color: var(--sky); }
    .sev.info { color: var(--muted); }
    code { font-family: var(--mono); font-size: 12px; color: #d7e7ff; }
    .detail { padding: 0; }
    .detail-body { padding: 16px 18px 20px; }
    .detail h2 { margin: 8px 0 10px; font-size: 18px; line-height: 1.35; }
    .detail p { color: #c9d6e8; line-height: 1.6; margin: 0 0 10px; }
    .empty { color: var(--muted); padding: 28px; }
    .guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .section { margin: 0; }
    .section h3 { margin: 0 0 8px; font-size: 15px; }
    .section ul { margin: 0; padding-left: 18px; color: #c9d6e8; line-height: 1.55; }
    .codebox { background:#08111d; border-radius:10px; padding:10px 12px; font-family:var(--mono); font-size:12px; overflow:auto; }
    .codebox .hit { color: var(--coral); background: rgba(255,107,122,.08); }
    .badge { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:11px; color:var(--muted); margin: 0 6px 6px 0; }
    .fix-box { background: #102033; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
    .fix-box strong { display: block; margin-bottom: 6px; color: var(--mint); font-size: 12px; }
    #view-rules .rules-bar { margin-bottom: 12px; max-width: 360px; }
    @media (max-width: 1080px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; height: auto; min-height: 100%; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
      .stats { grid-template-columns: repeat(3, 1fr); }
      .layout { grid-template-columns: 1fr; min-height: 420px; }
      #view-scan:not([hidden]) { min-height: 70vh; }
    }
    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .brand h1 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <img class="mark" src="/static/logo.jpg" width="52" height="52" alt="屿">
        <div>
          <h1>DeepOpen</h1>
          <p id="ver">本地代码检查台</p>
        </div>
      </div>
      <div class="tabs">
        <button class="ghost active" data-tab="scan">扫描</button>
        <button class="ghost" data-tab="rules">规则</button>
        <button class="ghost" data-tab="guide">清单</button>
      </div>
      <div class="block">
        <div>
          <label for="path">扫描路径</label>
          <input id="path" type="text" spellcheck="false">
        </div>
        <div>
          <label for="profile">配置档</label>
          <select id="profile">
            <option value="all">all · 全部规则</option>
            <option value="security">security · 安全 / 密钥 / 配置</option>
            <option value="bug">bug · 缺陷 / 质量</option>
            <option value="secret">secret · 仅密钥</option>
          </select>
        </div>
        <button id="run">开始检查</button>
      </div>
      <div class="block">
        <p class="block-title">导出与修复</p>
        <button id="export-md" class="plan">导出修改方案</button>
        <div class="row">
          <button id="export" class="ghost" style="flex:1">导出 HTML</button>
          <button id="export-json" class="ghost" style="flex:1">导出 JSON</button>
        </div>
        <button id="preview-fix" class="ghost">预览修复</button>
      </div>
      <div class="block">
        <p class="block-title">选项</p>
        <label class="opt"><input id="staged" type="checkbox"><span>仅 Git 暂存文件</span></label>
        <label class="opt"><input id="show-base" type="checkbox"><span>显示基线已接受项</span></label>
        <label class="opt"><input id="advisories" type="checkbox"><span>查询 OSV 依赖公告（需联网）</span></label>
      </div>
      <p class="hint" id="scan-meta">只监听本机 127.0.0.1。检查的是源码模式，不是渗透测试。</p>
    </aside>
    <main>
      <section id="view-scan">
        <div class="progress-wrap" id="progress-wrap" hidden>
          <div class="progress-head">
            <span id="progress-label">准备扫描…</span>
            <b id="progress-count">0/0</b>
          </div>
          <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
          <div class="progress-meta" id="progress-meta">已发现 0 个问题</div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="toolbar">
          <input id="q" type="text" placeholder="过滤规则、路径、说明">
          <span class="chip on" data-sev="all">全部</span>
          <span class="chip" data-sev="critical">严重</span>
          <span class="chip" data-sev="high">高危</span>
          <span class="chip" data-sev="medium">中等</span>
          <span class="chip" data-sev="low">低</span>
          <span class="chip" data-sev="info">提示</span>
          <select id="cat">
            <option value="all">全部类别</option>
            <option value="security">security</option>
            <option value="secret">secret</option>
            <option value="bug">bug</option>
            <option value="quality">quality</option>
            <option value="config">config</option>
          </select>
        </div>
        <div class="layout">
          <div class="list">
            <div class="list-head">命中列表</div>
            <table>
              <thead><tr><th>级别</th><th>规则</th><th>位置</th></tr></thead>
              <tbody id="rows"><tr><td colspan="3" class="empty">输入路径后点击「开始检查」。</td></tr></tbody>
            </table>
          </div>
          <div class="detail" id="detail">
            <div class="detail-head">问题详情</div>
            <div class="detail-body">
              <h2>等待扫描</h2>
              <p>命中项会显示说明和加固建议。请在自己的仓库上运行，不要把示例里的不安全写法拷进业务代码。</p>
            </div>
          </div>
        </div>
      </section>
      <section id="view-rules" hidden></section>
      <section id="view-guide" hidden></section>
    </main>
  </div>
  <script>
    const state = { findings: [], selected: 0, sev: "all", cat: "all", q: "", last: null, rules: [] };
    const SEV_LABEL = { critical: "严重", high: "高危", medium: "中等", low: "低", info: "提示" };

    const $ = (id) => document.getElementById(id);

    async function boot() {
      const meta = await (await fetch("/api/meta")).json();
      $("ver").textContent = "v" + meta.version + " · " + meta.rule_count + " 条规则";
      $("path").value = meta.default_path || "";
      const params = new URLSearchParams(location.search);
      if (params.get("path")) $("path").value = params.get("path");
      if (params.get("profile") && $("profile").querySelector(`option[value="${params.get("profile")}"]`)) {
        $("profile").value = params.get("profile");
      }
      renderStats({ critical:0, high:0, medium:0, low:0, info:0 });
      const guide = await (await fetch("/api/checklist")).json();
      $("view-guide").innerHTML = `<div class="guide-grid">${guide.sections.map(sec =>
        `<div class="panel section" style="padding:16px 18px"><h3>${esc(sec.title)}</h3><ul>${sec.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`
      ).join("")}</div>`;
      const rules = await (await fetch("/api/rules")).json();
      state.rules = rules.rules || [];
      renderRules();
      if (params.get("autoscan") === "1") $("run").click();
    }

    function renderRules(filter) {
      const q = (filter || "").toLowerCase();
      const rows = state.rules.filter(r => !q || (r.rule_id + r.title + (r.cwe || "")).toLowerCase().includes(q));
      $("view-rules").innerHTML = `<input id="ruleq" class="rules-bar" type="text" placeholder="搜索规则 ID / 标题" value="${esc(filter || "")}"><div class="list"><div class="list-head">共 ${rows.length} 条规则</div><table><thead><tr><th>ID</th><th>级别</th><th>规则</th></tr></thead><tbody>${
        rows.map(r => `<tr><td><code>${esc(r.rule_id)}</code></td><td class="sev ${esc(r.severity)}">${esc(SEV_LABEL[r.severity] || r.severity)}</td><td>${esc(r.title)}${r.cwe ? " · " + esc(r.cwe) : ""}</td></tr>`).join("")
      }</tbody></table></div>`;
      const box = $("ruleq");
      if (box) box.oninput = (ev) => renderRules(ev.target.value);
    }

    function renderStats(counts) {
      $("stats").innerHTML = ["critical","high","medium","low","info"].map(k =>
        `<div class="stat ${k}"><b>${counts[k] || 0}</b><span>${SEV_LABEL[k]}</span></div>`
      ).join("");
    }

    function visible() {
      const q = state.q.trim().toLowerCase();
      return state.findings.filter(item => {
        if (state.sev !== "all" && item.severity !== state.sev) return false;
        if (state.cat !== "all" && item.category !== state.cat) return false;
        if (!q) return true;
        return (item.rule_id + item.title + item.path + item.message + item.snippet).toLowerCase().includes(q);
      });
    }

    function renderList() {
      const items = visible();
      if (!items.length) {
        $("rows").innerHTML = `<tr><td colspan="3" class="empty">没有匹配的命中项。</td></tr>`;
        return;
      }
      $("rows").innerHTML = items.map((item, idx) => `
        <tr data-idx="${idx}" class="${idx === state.selected ? "selected" : ""}">
          <td class="sev ${esc(item.severity)}">${esc(SEV_LABEL[item.severity] || item.severity)}</td>
          <td><span class="rule-id">${esc(item.rule_id)}</span><br>${esc(item.title)}</td>
          <td><span class="muted">${esc(item.path)}:${item.line}</span><br><code>${esc(item.snippet)}</code></td>
        </tr>`).join("");
      renderDetail(items[state.selected] || items[0]);
    }

    async function renderDetail(item) {
      if (!item) return;
      const extra = [
        item.fixable ? '<span class="badge">可自动修复</span>' : "",
        item.baselined ? '<span class="badge">基线已接受</span>' : "",
        item.language ? `<span class="badge">${esc(item.language)}</span>` : "",
        item.cwe ? `<span class="badge">${esc(item.cwe)}</span>` : "",
      ].join("");
      $("detail").innerHTML = `
        <div class="detail-head">问题详情</div>
        <div class="detail-body">
          <div class="sev ${esc(item.severity)}">${esc(SEV_LABEL[item.severity] || item.severity)} · ${esc(item.category)}</div>
          <h2>${esc(item.rule_id)} ${esc(item.title)}</h2>
          <p>${extra}</p>
          <p><code>${esc(item.path)}:${item.line}</code></p>
          <p><code>${esc(item.snippet)}</code></p>
          <p>${esc(item.message)}</p>
          <div class="fix-box"><strong>加固建议</strong>${esc(item.remediation)}</div>
          <p><button class="ghost" id="copy-fix">复制加固建议</button></p>
          <div class="codebox" id="ctx">加载上下文…</div>
        </div>
      `;
      const copy = $("copy-fix");
      if (copy) copy.onclick = () => navigator.clipboard.writeText(item.remediation || "");
      try {
        const res = await fetch(`/api/snippet?path=${encodeURIComponent(item.path)}&line=${item.line}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "无法读取");
        $("ctx").innerHTML = data.lines.map(row =>
          `<div class="${row.hit ? "hit" : ""}">${row.n.toString().padStart(4," ")}  ${esc(row.text)}</div>`
        ).join("");
      } catch (err) {
        $("ctx").textContent = "没有源码上下文：" + err.message;
      }
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      }[ch]));
    }

    function phaseLabel(phase) {
      return ({
        listing: "正在列出文件",
        scan: "正在扫描",
        review: "正在检查测试缺口",
        advisories: "正在检查依赖",
        done: "扫描完成"
      })[phase] || "正在扫描";
    }

    function showProgress(msg) {
      const wrap = $("progress-wrap");
      wrap.hidden = false;
      const total = msg.total || 0;
      const scanned = msg.scanned || 0;
      const findings = msg.findings || 0;
      const pct = msg.pct || 0;
      $("progress-label").textContent = phaseLabel(msg.phase);
      $("progress-count").textContent = scanned + "/" + total + "  " + pct + "%";
      $("progress-bar").style.width = pct + "%";
      const file = msg.path ? " · " + msg.path : "";
      $("progress-meta").textContent = "已发现 " + findings + " 个问题" + file;
      $("scan-meta").textContent = "文件 " + scanned + "/" + total + " · 已发现 " + findings + " 个问题";
      $("run").textContent = msg.phase === "done" ? "开始检查" : "扫描中 " + scanned + "/" + total;
    }

    async function readScanStream(res) {
      if (!res.body || !res.body.getReader) return null;
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let result = null;
      while (true) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const line of lines) {
          if (!line.trim()) continue;
          const msg = JSON.parse(line);
          if (msg.event === "progress") showProgress(msg);
          else if (msg.event === "done") result = msg.result;
          else if (msg.event === "error") throw new Error(msg.error || "扫描失败");
        }
      }
      if (buf.trim()) {
        const msg = JSON.parse(buf);
        if (msg.event === "progress") showProgress(msg);
        else if (msg.event === "done") result = msg.result;
        else if (msg.event === "error") throw new Error(msg.error || "扫描失败");
      }
      return result;
    }

    function applyScanResult(data) {
      state.last = data;
      state.findings = data.findings || [];
      state.selected = 0;
      renderStats(data.counts || {});
      const langs = data.languages ? Object.entries(data.languages).map(([k,v]) => k + "=" + v).join(" · ") : "";
      const total = data.files_total || data.files_scanned || 0;
      $("scan-meta").textContent = `文件 ${data.files_scanned || 0}/${total} · 命中 ${data.finding_count || 0} · ${data.duration_ms || 0}ms` +
        (data.profile ? ` · ${data.profile}` : "") +
        (data.baselined_count ? ` · 基线忽略 ${data.baselined_count}` : "") +
        (langs ? ` · ${langs}` : "");
      showProgress({
        phase: "done",
        total,
        scanned: total,
        findings: data.finding_count || 0,
        pct: 100
      });
      renderList();
      if (!state.findings.length) {
        $("detail").innerHTML = `<div class="detail-head">问题详情</div><div class="detail-body"><h2>未发现规则命中</h2><p>这不代表没有缺陷，只说明当前规则没有匹配。</p></div>`;
      }
    }

    $("run").onclick = async () => {
      $("run").disabled = true;
      $("run").textContent = "检查中…";
      showProgress({ phase: "listing", total: 0, scanned: 0, findings: 0, pct: 0 });
      const body = {
        path: $("path").value,
        staged: $("staged").checked,
        show_baseline: $("show-base").checked,
        profile: $("profile").value,
        advisories: $("advisories").checked
      };
      try {
        const res = await fetch("/api/scan/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({ error: "扫描失败" }));
          throw new Error(data.error || "扫描失败");
        }
        let data = await readScanStream(res);
        if (!data) {
          const fallback = await fetch("/api/scan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          data = await fallback.json();
          if (!fallback.ok) throw new Error(data.error || "扫描失败");
        }
        applyScanResult(data);
      } catch (err) {
        $("detail").innerHTML = `<div class="detail-head">问题详情</div><div class="detail-body"><h2>无法完成扫描</h2><p>${esc(err.message)}</p></div>`;
      } finally {
        $("run").disabled = false;
        $("run").textContent = "开始检查";
      }
    };

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function exportScan(format, filename) {
      const res = await fetch("/api/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          path: $("path").value,
          staged: $("staged").checked,
          show_baseline: $("show-base").checked,
          profile: $("profile").value,
          advisories: $("advisories").checked,
          format
        })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({ error: "导出失败" }));
        throw new Error(data.error || "导出失败");
      }
      downloadBlob(await res.blob(), filename);
    }

    $("export-md").onclick = async () => {
      try {
        await exportScan("md", "deepopen-fix-plan.md");
      } catch (err) {
        $("detail").innerHTML = `<div class="detail-head">问题详情</div><div class="detail-body"><h2>无法导出修改方案</h2><p>${esc(err.message)}</p></div>`;
      }
    };

    $("export").onclick = async () => {
      try {
        await exportScan("html", "deepopen-report.html");
      } catch (err) {
        $("detail").innerHTML = `<div class="detail-head">问题详情</div><div class="detail-body"><h2>无法导出 HTML</h2><p>${esc(err.message)}</p></div>`;
      }
    };

    $("rows").onclick = (ev) => {
      const tr = ev.target.closest("tr[data-idx]");
      if (!tr) return;
      state.selected = Number(tr.dataset.idx);
      renderList();
    };

    $("export-json").onclick = async () => {
      try {
        await exportScan("json", "deepopen-report.json");
      } catch (err) {
        $("detail").innerHTML = `<div class="detail-head">问题详情</div><div class="detail-body"><h2>无法导出 JSON</h2><p>${esc(err.message)}</p></div>`;
      }
    };

    $("preview-fix").onclick = async () => {
      const res = await fetch("/api/fix", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: $("path").value, apply: false })
      });
      const data = await res.json();
      const lines = (data.changes || []).map(c => `${c.path}:${c.line} ${c.rule_id}\n- ${c.before}\n+ ${c.after}`);
      $("detail").innerHTML = `<div class="detail-head">问题详情</div><div class="detail-body"><h2>修复预览</h2><p>共 ${data.changes ? data.changes.length : 0} 处，仅质量问题。要用 CLI 写回：<code>python -m deepopen fix --apply</code></p><pre class="codebox">${esc(lines.join("\n\n") || "没有可自动修复的命中。")}</pre></div>`;
    };

    $("cat").onchange = (ev) => { state.cat = ev.target.value; state.selected = 0; renderList(); };
    $("q").oninput = (ev) => { state.q = ev.target.value; state.selected = 0; renderList(); };

    document.querySelectorAll(".chip").forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
        chip.classList.add("on");
        state.sev = chip.dataset.sev;
        state.selected = 0;
        renderList();
      };
    });

    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        $("view-scan").hidden = tab !== "scan";
        $("view-rules").hidden = tab !== "rules";
        $("view-guide").hidden = tab !== "guide";
      };
    });

    boot();
  </script>
</body>
</html>
