[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepopen"
version = "0.4.0"
description = "本地静态检查：发现代码缺陷与常见不安全写法，并给出加固建议"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "deepopen" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
deepopen = "deepopen.cli:main"

[tool.setuptools.packages.find]
include = ["deepopen*"]

[tool.setuptools.package-data]
deepopen = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
